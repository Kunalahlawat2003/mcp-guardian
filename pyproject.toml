[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-guardian"
version = "0.1.0"
description = "Human-in-the-loop firewall for Model Context Protocol (MCP) requests made by Claude Desktop and claude.ai"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "model-context-protocol", "claude", "security", "proxy", "human-in-the-loop"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
]
# The stdio shim and the daemon only need the standard library (+ Tkinter for the popup).
# aiohttp is used by the HTTP gateway that protects claude.ai remote connectors.
dependencies = ["aiohttp>=3.10", "certifi"]

[project.optional-dependencies]
# Official MCP Python SDK: used by the bundled demo server and the end-to-end tests.
demo = ["mcp>=2.0"]
# Optional macOS polish: hide the Dock icon and bring popups to the front.
macos = ["pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'"]
dev = ["mcp>=2.0", "pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
mcp-guardian = "mcp_guardian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
